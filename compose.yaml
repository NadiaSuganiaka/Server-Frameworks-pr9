services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pr09
      POSTGRES_PASSWORD: pr09_local_only
      POSTGRES_DB: pr09
    ports:
      - "127.0.0.1:5549:5432"
    volumes:
      - pr09-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr09 -d pr09"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pr09-data:
